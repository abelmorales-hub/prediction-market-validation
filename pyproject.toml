[project]
name = "prediction-market-validation"
version = "0.1.0"
description = "Out-of-sample validation of forecasts against prediction market prices. Read-only."
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "duckdb>=1.1",
    # duckdb needs pytz to materialise timestamptz columns into Python datetimes.
    # Every snapshot query returns them, so casting at each call site is the worse trade.
    "pytz>=2024.1",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "scipy-stubs>=1.14",
]

# Not an installable package; `src` and `scripts` are imported from the repo root.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use `type` statements that only parse
# under 3.12+, so mypy checks against the venv interpreter. ruff's target-version still
# holds the floor at py311.
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: hits the live API; excluded from the default run"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

# The golden rule, enforced mechanically. A scorer that can see the model is a scorer
# that will eventually be bent to flatter it, and no amount of intent prevents that.
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "scoring must not see models or baselines"
type = "forbidden"
source_modules = ["src.scoring"]
forbidden_modules = ["src.models", "src.baselines"]

[[tool.importlinter.contracts]]
name = "scoring must not reach the network or the database"
type = "forbidden"
source_modules = ["src.scoring"]
forbidden_modules = ["src.ingest", "src.storage", "src.scheduler", "src.resolution"]
