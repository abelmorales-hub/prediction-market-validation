[project]
name = "prediction-market-validation"
version = "0.1.0"
description = "Out-of-sample validation of forecasts against prediction market prices. Read-only."
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

# Not an installable package; `src` and `scripts` are imported from the repo root.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: hits the live API; excluded from the default run"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
